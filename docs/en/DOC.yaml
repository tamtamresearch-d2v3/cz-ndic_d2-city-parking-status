perex: 'This document describes the data format used to provide information about the current occupancy of urban car parks and park-and-ride sites: the occupancy rate and the status of the car park (spaces available, almost full, full). The format carries only variable data; the description of car parks (name, location, capacity, operator) is provided by the static format x-format:cz-ndic_d2-city-parking-table-v1.0, whose table the messages reference. The format is based on the prk:ParkingStatusPublication of the DATEX II 3.7 model and is a light subset of the profile for truck parking (ITP).'
keywords: DATEX II, NDIC, ParkingStatusPublication
